[package]
name = "vectordash"
version = "0.3.34-beta.1"
edition = "2024"
license = "MIT"
[dependencies]
anyhow = "1"
semver = "1"
regex = "1"
half = "2"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
unicode-segmentation = "1"
pulldown-cmark = { version = "0.13", default-features = false }
egui_commonmark = { version = "0.22", default-features = false }
arboard = { version = "3", features = ["image-data"] }
cpal = "0.16"
hound = "3"
tempfile = "3"
bzip2 = "0.6"
tar = "0.4"
xcap = "0.9"
egui_extras = { version = "0.33", features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "webp", "gif", "bmp", "tiff"] }
jxl-oxide = { version = "0.12", features = ["image"] }
libloading = "0.8"
lopdf = "0.38"
meval = "0.2"
quick-xml = "0.39"
scraper = { version = "=0.27.0", default-features = false }
rand = "0.9"
raw-window-handle = "0.6"
rfd = "0.16"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl", "backup", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tiny_http = "0.12"
ureq = { version = "3", features = ["json"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "multipart"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros"] }
walkdir = "2"
notify = "8"
zip = { version = "4", default-features = false, features = ["deflate"] }
[build-dependencies]
embed-resource = "3"
[target.'cfg(windows)'.dependencies]
windows-numerics = "0.2"
windows = { version = "0.61", features = ["UI_Composition", "UI_Composition_Desktop", "System", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_System_Com_StructuredStorage", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D10", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Accessibility", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Performance", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_DataExchange", "Win32_System_SystemInformation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Security_Authorization", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
[dev-dependencies]
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
eframe = { path = "vendor/eframe" }
